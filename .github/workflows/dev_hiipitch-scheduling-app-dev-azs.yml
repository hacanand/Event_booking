name: Build and Deploy Next.js App to Azure Web App

on:
  push:
    branches:
      - dev  # Change to your branch name
  workflow_dispatch:

env:
  APPLICATION_PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
  WEBAPP_NAME: "hiipitch-scheduling-app-dev-azs"

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      # Step 3: Install dependencies, build the app, and prepare for deployment
      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build
          mv ./.next ./build/standalone/.next  # Move `.next` to the standalone folder
          mv ./public ./build/standalone/      # Include the public folder

      # Step 4: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ env.APPLICATION_PUBLISH_PROFILE }}
          package: ./build/standalone
